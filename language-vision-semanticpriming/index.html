<!doctype html>
<!--
  Local / standalone entry point for the language-vision-semanticpriming
  experiment. See README.md for an overview of the file layout, the task
  sequence, the Gorilla counterpart (index-in-Gorilla.html), and the
  preregistered constants that the task scripts must respect.

  This file does only three things:
    1. Loads the jsPsych runtime and plugins (CDN).
    2. Initialises jsPsych with study-wide hooks (Prolific metadata, redirect,
       optional ?autotest=1 smoke-test mode and ?audit=1 review mode).
    3. Loads the task scripts under js/ in the order they should appear in
       the timeline. Each task script pushes its own trials onto the shared
       global `language_vision_SemPri_TIMELINE`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language &amp; Vision Experiment</title>

    <!-- jsPsych runtime + plugins (pinned CDN versions; update together). -->
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-rok@2.0.0"></script>

    <!-- Shared session-wide settings: the one termination message and the
         session-integrity recording. Must load before any task script. -->
    <script src="js/session_integrity.js"></script>
    <script src="js/fullscreen_guard.js"></script>

    <!--
      Initialise jsPsych, create the general timeline, start full-screen mode.

      Optional smoke-test mode (?autotest=1) auto-solves every trial and
      downloads the resulting CSV/JSON instead of redirecting to Prolific.
      It is for development only. The Gorilla bootstrap has a matching mode for
      an included end-to-end pretest launched from a real participant entry URL.

      Internal audit mode (?audit=1) leaves the participant-facing content and
      timings unchanged, adds a persistent audit notice, and never redirects
      to Prolific. It sends no response data anywhere; data remain in browser
      memory until the audit page is closed or refreshed.
    -->
    <script>
      var URL_PARAMETERS = new URLSearchParams(window.location.search);
      var AUTO_TEST = /^(1|true|yes)$/i.test(URL_PARAMETERS.get("autotest") || "");
      var AUDIT_MODE = /^(1|true|yes)$/i.test(URL_PARAMETERS.get("audit") || "");
      // A short cap keeps the full integration test practical without changing
      // any production timing. The keyboard retries below can outlast it, so
      // each retry first checks that its own trial is still running.
      var AUTO_TEST_MAX_DELAY_MS = 80;
      window.AUTO_TEST = AUTO_TEST;
      window.AUDIT_MODE = AUDIT_MODE;
      // The browser smoke test exercises task logic, not the browser's
      // user-gesture-only Fullscreen API. Do not pause a headless test before
      // it reaches the welcome screen.
      window.FULLSCREEN_GUARD_MODE = AUTO_TEST ? "disabled" : "browser";
      if (AUDIT_MODE) document.documentElement.classList.add("audit-mode");

      // Buffer uncaught errors so they are surfaced in the autotest export.
      window._autotest_errors = [];
      window.addEventListener("error", function (ev) {
        var msg = ev && ev.message ? String(ev.message) : "";
        if (!ev.filename && (ev.lineno === 0 || msg === "Script error.")) return;
        window._autotest_errors.push(
          (ev.filename || "") + ":" + ev.lineno + " \u2014 " + msg,
        );
      });

      function autoTestKeyForTrial(trial) {
        var choices = trial && trial.choices;
        var stimulus_html =
          trial && typeof trial.stimulus === "function"
            ? trial.stimulus()
            : trial && trial.stimulus;

        // Solve the instructional manipulation check deterministically.
        if (
          typeof stimulus_html === "string" &&
          stimulus_html.includes("Attention check!")
        ) {
          var position_match = stimulus_html.match(
            /<b>(first|second|third|fourth)<\/b>/i,
          );
          var digits_match = stimulus_html.match(/>(\d{4})<\/span>/);
          if (position_match && digits_match) {
            var position_lookup = { first: 0, second: 1, third: 2, fourth: 3 };
            var pos = position_lookup[position_match[1].toLowerCase()];
            return digits_match[1].charAt(pos);
          }
        }

        if (Array.isArray(choices)) {
          if (choices.includes(" ")) return " ";
          if (choices.includes("f")) return "f";
          if (choices.includes("j")) return "j";
          if (choices.length > 0) return choices[0];
        }

        if (choices === "ALL_KEYS") return "1";
        return null;
      }

      function triggerAutoResponse(trial) {
        if (!AUTO_TEST) return;

        // Auto-click button trials. on_trial_start receives a copy of the trial
        // whose type is the plugin class, so match on its static info.name.
        if (
          trial &&
          trial.type &&
          trial.type.info &&
          trial.type.info.name === "html-button-response"
        ) {
          setTimeout(function () {
            var first_button = document.querySelector(".jspsych-btn");
            if (first_button) first_button.click();
          }, 10);
          return;
        }

        var key = autoTestKeyForTrial(trial);
        if (!key) return;

        /* jsPsych's keyboard listener (KeyboardListenerAPI) sits on the display
        container, which is body here, NOT on document. A KeyboardEvent
        dispatched on document is therefore never seen by the
        html-keyboard-response or rok plugins, leaving every trial
        "unanswered". The key is dispatched on the display element
        (#jspsych-content) with bubbles:true, which carries it up to that
        listener, and is also fired on document for any handler bound there.

        A trial writes its data row when it ends, so a change in the row count
        means the trial this key was meant for has finished. */
        var rows_at_start = jsPsych.data.get().count();
        function dispatchKey() {
          if (jsPsych.data.get().count() !== rows_at_start) return;
          var target =
            (jsPsych.getDisplayElement && jsPsych.getDisplayElement()) || document;
          var event_init = { key: key, bubbles: true };
          target.dispatchEvent(new KeyboardEvent("keydown", event_init));
          target.dispatchEvent(new KeyboardEvent("keyup", event_init));
          if (target !== document) {
            document.dispatchEvent(new KeyboardEvent("keydown", event_init));
            document.dispatchEvent(new KeyboardEvent("keyup", event_init));
          }
        }

        /* The rok plugin only registers its keyboard listener after its first
        animation frame, so a single early dispatch can be missed. Retry at a
        few increasing delays. A retry can fire after a short trial has ended
        and the next one has started, which is why dispatchKey checks the row
        count first. The Gorilla bootstrap uses the same schedule. */
        [25, 45, 70, 120].forEach(function (delay) {
          setTimeout(dispatchKey, delay);
        });
      }

      function compressTrialForAutoTest(trial) {
        if (!AUTO_TEST || !trial) return;

        if (typeof trial.trial_duration === "number") {
          trial.trial_duration = Math.min(trial.trial_duration, AUTO_TEST_MAX_DELAY_MS);
        } else if (typeof trial.trial_duration === "function") {
          var original_duration_fn = trial.trial_duration;
          trial.trial_duration = function () {
            var value = original_duration_fn();
            return typeof value === "number"
              ? Math.min(value, AUTO_TEST_MAX_DELAY_MS)
              : AUTO_TEST_MAX_DELAY_MS;
          };
        }

        // post_trial_gap is not capped here. jsPsych 8 reads it from the trial
        // description, not from this copy, and no active task sets it.

        if (trial.response_ends_trial === false) {
          trial.response_ends_trial = true;
        }
      }

      // Plain-language session stage applied to every trial. See the matching
      // block in index-in-Gorilla.html for rationale.
      var SECTION_LABELS = {
        ReadAbil_practice: "Reading ability \u2014 practice",
        ReadAbil_repeated_practice: "Reading ability \u2014 repeated practice",
        ReadAbil_main: "Reading ability \u2014 main",
        SemPri_practice: "Semantic priming \u2014 practice",
        SemPri_repeated_practice: "Semantic priming \u2014 repeated practice",
        SemPri_main: "Semantic priming \u2014 main",
        VisAbil_practice: "Visual ability \u2014 practice",
        VisAbil_main: "Visual ability \u2014 main",
        VisAbil: "Visual ability",
        MCT_practice: "Mental comparison \u2014 practice",
        MCT_main: "Mental comparison \u2014 main",
        IMC: "Instructional manipulation check",
      };
      var _last_section_tag = "";
      function tagSection(data) {
        if (data && data.task) _last_section_tag = data.task;
        var label = SECTION_LABELS[_last_section_tag] || _last_section_tag || "";
        if (data) data.section = label;
      }

      function downloadTextFile(filename, content, mimeType) {
        var blob = new Blob([content], { type: mimeType });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function saveAutoTestData() {
        var participant = jsPsych.data.get().values()[0].Participant || "autotest";
        var timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        downloadTextFile(
          "autotest_" + participant + "_" + timestamp + ".csv",
          jsPsych.data.get().csv(),
          "text/csv;charset=utf-8",
        );
        downloadTextFile(
          "autotest_" + participant + "_" + timestamp + ".json",
          jsPsych.data.get().json(),
          "application/json;charset=utf-8",
        );
      }

      var jsPsych = initJsPsych({
        on_trial_start: function (trial) {
          compressTrialForAutoTest(trial);
          triggerAutoResponse(trial);
        },

        // Tag every trial with its plain-language session stage.
        on_trial_finish: function (data) {
          tagSection(data);
          if (typeof window.fullscreenGuardMarkTrial === "function") {
            window.fullscreenGuardMarkTrial(data);
          }
          // Mirrors index-in-Gorilla.html: the counts go on the last row as
          // it finishes, the one moment both entry points share.
          if (typeof window.attachSessionSummaryIfLast === "function") {
            window.attachSessionSummaryIfLast(data);
          }
        },

        // Final processes at the end of the experiment
        on_finish: function () {
          // Remove requirement to verify redirect
          window.removeEventListener("beforeunload", verify_unload);

          // Record experiment end time
          jsPsych.data.addProperties({
            experiment_end: new Date().toUTCString(),
          });

          // Add interactions to the data variable
          var interaction_data = jsPsych.data.getInteractionData();
          jsPsych.data.get().addToLast({ interactions: interaction_data.json() });

          // Session-integrity counts, as in index-in-Gorilla.html.
          if (typeof window.sessionIntegritySummary === "function") {
            jsPsych.data.get().addToLast(window.sessionIntegritySummary());
          }

          if (AUTO_TEST) {
            jsPsych.data.get().addToLast({
              autotest_errors: (window._autotest_errors || []).join(" || "),
            });
            saveAutoTestData();
            return;
          }

          // Audit links must never complete a Prolific submission, including
          // if a reviewer has accidentally retained URL parameters from one.
          if (AUDIT_MODE) return;

          // A terminated session is handed back by the termination message's
          // own button (window.prolificReturn in js/session_integrity.js),
          // which carries the return path's code; redirecting here would send
          // the participant down the completion path instead.
          if (window.SESSION_TERMINATED) return;

          // Redirect to the Prolific submission page. The completion code is
          // read from the entry URL (?completion_code=XXXX) rather than compiled
          // in: Prolific issues a new code per study, and the literal that used
          // to sit here was left over from an earlier one. With no code, stop on
          // the final screen instead of sending the participant to a submission
          // that is not theirs. In the Gorilla deployment the Finish node's
          // onward URL does this, from the code stored by the bootstrap.
          var completion_code = null;
          try {
            completion_code = new URLSearchParams(window.location.search).get(
              "completion_code",
            );
          } catch (e) {}
          if (completion_code) {
            window.location =
              "https://app.prolific.com/submissions/complete?cc=" + completion_code;
          }
        },

        // No engine-level response floor. A comment here used to claim the
        // 100 ms floor implemented the preregistered premature-response
        // window at target onset; it implemented nothing of the sort, and it
        // broke the thing that does. The window is the separate 100 ms
        // component trial that shows the word with response_ends_trial: false
        // and LOGS any press; with the floor at 100 ms, jsPsych discarded
        // every press within the first 100 ms of each component, which is the
        // entire lifetime of that component, so premature presses at word
        // onset (and during short interstimulus intervals) were never logged
        // at all. The response-bearing trials never see anticipatory presses
        // anyway, because their clock starts 100 ms after word onset, and the
        // registered analysis excludes response times under 200 ms on top.
        minimum_valid_rt: 0,
      });

      // One fresh seed per session, recorded on every row as rng_seed and set
      // before any task script builds its schedule. It is drawn as an unsigned
      // 32-bit integer and recorded as a string of digits, which survives a CSV
      // round trip exactly. setSeed replaces Math.random with one seeded stream,
      // so the seed regenerates the schedules built when the task scripts load:
      // the semantic-priming item order, the practice and main ISI pairings, and
      // the fallback list sample. Draws made while the session runs depend on
      // responses and frame timing (randomize_order timelines, jittered
      // durations, the attention-check digits, the moving dots), so they cannot
      // be replayed from the seed. Their values are recorded on each row.
      var SESSION_RNG_SEED = String(
        window.crypto.getRandomValues(new Uint32Array(1))[0],
      );
      jsPsych.randomization.setSeed(SESSION_RNG_SEED);
      window.SESSION_RNG_SEED = SESSION_RNG_SEED;

      // jsPsych may resolve dynamic trial parameters before on_trial_start, so
      // changing the trial object there alone cannot guarantee a short test.
      // Plugins time their trial durations through this timer, so capping it
      // shortens every plugin-level duration. It is capped only for ?autotest=1.
      if (AUTO_TEST && jsPsych.pluginAPI && jsPsych.pluginAPI.setTimeout) {
        var originalPluginSetTimeout = jsPsych.pluginAPI.setTimeout.bind(
          jsPsych.pluginAPI,
        );
        jsPsych.pluginAPI.setTimeout = function (callback, delay) {
          return originalPluginSetTimeout(
            callback,
            typeof delay === "number" ? Math.min(delay, AUTO_TEST_MAX_DELAY_MS) : 0,
          );
        };
      }

      /* Create empty timeline object, which will be sequentially 
      filled in using language_vision_SemPri_TIMELINE.push() */
      var language_vision_SemPri_TIMELINE = [];

      // Full-screen mode
      var enter_fullscreen = {
        type: jsPsychFullscreen,
        fullscreen_mode: true,
      };
      // The automated smoke test deliberately skips the user-gesture-only
      // fullscreen request. Production and audit sessions retain it.
      if (!AUTO_TEST) language_vision_SemPri_TIMELINE.push(enter_fullscreen);
    </script>

    <!-- Function for creating range of numbers -->
    <script>
      function makeArr(startValue, stopValue, cardinality) {
        var arr = [];
        var step = (stopValue - startValue) / (cardinality - 1);
        for (var i = 0; i < cardinality; i++) {
          arr.push(startValue + step * i);
        }
        return arr;
      }
    </script>

    <!-- Initialise trial number -->
    <script>
      var TrialNum = 0;
    </script>

    <!-- Assign participant and session metadata to jsPsych data -->
    <script>
      // Capture info from Prolific
      var Prolific_subject_id = jsPsych.data.getURLVariable("PROLIFIC_PID");
      var Prolific_study_id = jsPsych.data.getURLVariable("STUDY_ID");
      var Prolific_session_id = jsPsych.data.getURLVariable("SESSION_ID");

      jsPsych.data.addProperties({
        Participant: jsPsych.randomization.randomID(15),
        experiment_start: new Date().toUTCString(),
        rng_seed: SESSION_RNG_SEED,
        rng_engine: "jsPsych.randomization.setSeed",
        autotest_mode: AUTO_TEST,
        audit_mode: AUDIT_MODE,
        Prolific_subject_id: Prolific_subject_id,
        Prolific_study_id: Prolific_study_id,
        Prolific_session_id: Prolific_session_id,
      });

      // Environment facts fixed for the session, recorded as in
      // index-in-Gorilla.html so the two entry points produce the same columns.
      if (typeof window.sessionIntegrityStatic === "function") {
        jsPsych.data.addProperties(window.sessionIntegrityStatic());
      }
    </script>

    <!-- Prevent backing and refreshing (as in 
    https://github.com/nivlab/jspsych-demos/blob/main/tasks/vocabulary/experiment.html) -->
    <script>
      function verify_unload(e) {
        e.preventDefault();
        (e || window.event).returnValue = null;
        return null;
      }
      window.addEventListener("beforeunload", verify_unload);
    </script>

    <!-- Load in CSS -->
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />
    <link rel="stylesheet" href="style.css" />

    <!--
      Task scripts. Order matters: each script appends its own trials to
      `language_vision_SemPri_TIMELINE`, so the load order below IS the
      experiment order. See README.md for the rationale behind this sequence
      and the corresponding preregistered constants.
    -->

    <!-- Shared utilities (used by every task) -->
    <script src="js/breaks.js"></script>
    <script src="js/instructional_manipulation_check.js"></script>

    <!-- Session-level screens are independent of every task. -->
    <script src="js/study_welcome.js"></script>

    <!-- 1. Reading ability (tag: 'ReadAbil_main') -->
    <script src="js/reading_ability_stimuli.js"></script>
    <script src="js/reading_ability_task.js"></script>

    <!-- 2. Semantic priming (tag: 'SemPri') -->
    <script src="js/semanticpriming_practice_stimuli.js"></script>
    <script src="js/semanticpriming_main_stimuli_1.js"></script>
    <script src="js/semanticpriming_main_stimuli_2.js"></script>
    <script src="js/semanticpriming_task.js"></script>

    <!-- Working-memory (backward digit span) task removed from the battery: it carried
         no hypothesis and is not part of the registered design. The file has been
         moved to js/archive/working_memory_task.js and is no longer loaded. -->

    <!-- 3. Visual ability (tag: 'VisAbil') -->
    <!-- Placed after the semantic priming task because visually demanding
         tasks can increase perceptual simulation in subsequent semantic
         tasks (Pecher et al., 2003; Yee et al., 2012). -->
    <script src="js/visual_ability_task.js"></script>

    <!-- 4. Mental Comparison Task (tag: 'MCT') -->
    <!-- Multimodal (visual, auditory, tactile) comparison paradigm adapted
         from Suggate (2024). Placed last to avoid priming explicit imagery
         strategies in the earlier behavioural tasks. -->
    <script src="js/mct_stimuli.js"></script>
    <script src="js/mct_task.js"></script>
    <script src="js/study_debrief.js"></script>

    <!-- Exit full-screen and end experiment -->
    <script>
      var exit_fullscreen = {
        type: jsPsychFullscreen,
        fullscreen_mode: false,
        delay_after: 0,
        on_start: function () {
          if (typeof window.fullscreenGuardDisarm === "function") {
            window.fullscreenGuardDisarm();
          }
        },
      };
      // The session debrief is the last timeline item. Full screen is left BEFORE it,
      // so the debrief is read out of full screen and the session ends on
      // the debrief's own button rather than on a blank fullscreen trial.
      if (!AUTO_TEST) {
        language_vision_SemPri_TIMELINE.splice(
          language_vision_SemPri_TIMELINE.length - 1,
          0,
          exit_fullscreen,
        );
      }
    </script>
  </head>

  <body></body>

  <!-- Run experiment -->
  <script>
    // This is deliberately outside the study timeline, so it remains visible
    // through every task during an internal audit without altering its content.
    if (AUDIT_MODE) document.body.classList.add("audit-mode");

    // If js/session_integrity.js failed to load, the termination messages it
    // defines are missing and a session ended by a failed check would throw
    // instead of telling the participant what to do. This local entry point
    // falls back to a generic message; index-in-Gorilla.html stops the session
    // before its first screen instead.
    if (typeof window.prolificExitMessage !== "function") {
      console.error(
        "[index] js/session_integrity.js did not load; termination messages " +
          "will use a fallback and no session-integrity data will be recorded.",
      );
      window.prolificExitMessage = function () {
        window.SESSION_TERMINATED = "unknown";
        return (
          "<div style='max-width:40em;margin:auto;text-align:left'>" +
          "<p>Thank you for the time you have given. The study has ended early, " +
          "because one of the checks described in the study description was " +
          "not passed.</p>" +
          "<p>This means your submission is <b>returned rather than paid</b>. " +
          "Returning a submission counts against nothing on your Prolific " +
          "record. Please close this tab, go back to the study page on " +
          "Prolific, and choose <b>Stop without completing</b>.</p>" +
          "<p>If you believe the study ended in error, please message us " +
          "through Prolific and we will look into it.</p></div>"
        );
      };
    }

    jsPsych.run(language_vision_SemPri_TIMELINE);
  </script>
</html>
